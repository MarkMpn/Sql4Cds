trigger: none
pr:
  - master
    
pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- checkout: self
  persistCredentials: true

- task: NuGetCommand@2
  displayName: Install GitVersion
  inputs:
    command: custom
    arguments: install GitVersion.CommandLine -Version 5.12.0 -OutputDirectory $(Build.BinariesDirectory)/tools -ExcludeVersion

- script: $(Build.BinariesDirectory)/tools/GitVersion.CommandLine/tools/GitVersion.exe /output buildserver /nofetch /updateassemblyinfo
  displayName: Determine Version (NetFX)

- script: $(Build.BinariesDirectory)/tools/GitVersion.CommandLine/tools/GitVersion.exe /output buildserver /nofetch /updateprojectfiles
  displayName: Determine Version (NetCore)

- task: PowerShell@2
  displayName: Update version in the vsix manifest
  inputs:
    filePath: 'MarkMpn.Sql4Cds.SSMS\update-version.ps1'
    arguments: '$(GitVersion.AssemblySemVer)'
    pwsh: true

- task: DotNetCoreCLI@2
  displayName: dotnet restore
  inputs:
    command: restore
    projects: '**/*.csproj'
    feedsToUse: 'select'
    includeNuGetOrg: true

- task: VSBuild@1
  displayName: Build
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: '/p:DeployExtension=false'

- task: VSTest@3
  inputs:
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    testAssemblyVer2: |
      **/MarkMpn.*.Tests.dll
      **/MarkMpn.*.Tests.NetCore.dll
      !**\obj\**
  
- task: NodeTool@0
  displayName: Install Node.js for VS Code extension
  inputs:
    versionSpec: '24.x'

- script: |
    call npm ci --ignore-scripts
    call npm --no-git-tag-version --allow-same-version version $(GitVersion.SemVer)
    call npm run package
  displayName: Build VS Code extension
  workingDirectory: '$(Build.SourcesDirectory)\VSCodeExtension'
  
- task: PowerShell@2
  displayName: Stamp PPTB client and worker release versions
  inputs:
    targetType: inline
    pwsh: true
    workingDirectory: '$(Build.SourcesDirectory)\MarkMpn.Sql4Cds.PPTB'
    script: |
      npm ci --ignore-scripts
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      npm --no-git-tag-version --allow-same-version version $(GitVersion.SemVer)
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $config = Get-Content pptb.config.json -Raw | ConvertFrom-Json
      $config.workers.sql4cds.packageVersion = '$(GitVersion.NuGetVersion)'
      $config | ConvertTo-Json -Depth 10 | Set-Content pptb.config.json

- task: DotNetCoreCLI@2
  displayName: Package PPTB language server worker
  inputs:
    command: custom
    custom: pack
    arguments: 'MarkMpn.Sql4Cds.LanguageServer/MarkMpn.Sql4Cds.LanguageServer.csproj --configuration Release --no-restore -p:Version=$(GitVersion.NuGetVersion) --output $(Build.ArtifactStagingDirectory)/PPTB/worker'

- script: |
    call npm run build
    if errorlevel 1 exit /b %errorlevel%
    call npm run finalize-package
    if errorlevel 1 exit /b %errorlevel%
    if not exist "$(Build.ArtifactStagingDirectory)\PPTB" mkdir "$(Build.ArtifactStagingDirectory)\PPTB"
    if errorlevel 1 exit /b %errorlevel%
    call npm pack --pack-destination "$(Build.ArtifactStagingDirectory)\PPTB"
  displayName: Build and package PPTB client
  workingDirectory: '$(Build.SourcesDirectory)\MarkMpn.Sql4Cds.PPTB'
