trigger: none
pr: none
    
pool:
  vmImage: 'windows-latest'

variables:
- group: CodeSigning
- name: solution
  value: '**/*.sln'
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'
- name: isMain
  value: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]

steps:
- checkout: self
  persistCredentials: true

- task: NuGetCommand@2
  displayName: Install GitVersion
  inputs:
    command: custom
    arguments: install GitVersion.CommandLine -Version 5.12.0 -OutputDirectory $(Build.BinariesDirectory)/tools -ExcludeVersion

- script: $(Build.BinariesDirectory)/tools/GitVersion.CommandLine/tools/GitVersion.exe /output buildserver /nofetch /updateassemblyinfo
  displayName: Determine Version (NetFX)

- script: $(Build.BinariesDirectory)/tools/GitVersion.CommandLine/tools/GitVersion.exe /output buildserver /nofetch /updateprojectfiles
  displayName: Determine Version (NetCore)

- task: PowerShell@2
  displayName: Update version in the vsix manifest
  inputs:
    filePath: 'MarkMpn.Sql4Cds.SSMS\update-version.ps1'
    arguments: '$(GitVersion.AssemblySemVer)'
    pwsh: true
- task: NodeTool@0
  displayName: Install Node.js for VS Code extension
  inputs:
    versionSpec: '24.x'

- task: DotNetCoreCLI@2
  displayName: dotnet restore
  inputs:
    command: restore
    projects: '**/*.csproj'
    feedsToUse: 'select'
    includeNuGetOrg: true

- task: VSBuild@1
  displayName: Build
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: '/p:DeployExtension=false /p:Version=$(GitVersion.NuGetVersion)'

- task: VSTest@2
  inputs:
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    testAssemblyVer2: |
      **/MarkMpn.*.Tests.dll
      !**\obj\**

- task: NuGetToolInstaller@1
  inputs:
    versionSpec: '*'
    checkLatest: true

- task: NuGetCommand@2
  displayName: Pack
  inputs:
    command: pack
    packagesToPack: '**/*.nuspec'
    packDestination: '$(Build.ArtifactStagingDirectory)'
    versioningScheme: byEnvVar
    versionEnvVar: GITVERSION_NUGETVERSION

- task: PublishPipelineArtifact@1
  displayName: Publish NuGet packages to pipeline
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)'
    artifact: 'NuGetPackages'
    publishLocation: 'pipeline'
    
- task: PublishPipelineArtifact@1
  displayName: Publish SSMS 22 installer to pipeline
  inputs:
    targetPath: 'MarkMpn.Sql4Cds.SSMS.22\bin\$(buildConfiguration)\MarkMpn.Sql4Cds.SSMS.22.vsix'
    artifact: 'SSMS22Installer'
    publishLocation: 'pipeline'

- task: PublishPipelineArtifact@1
  displayName: Publish Debug Visualizer installer to pipeline
  inputs:
    targetPath: 'MarkMpn.Sql4Cds.DebugVisualizer.DebuggerSide\bin\$(buildConfiguration)\net472\MarkMpn.Sql4Cds.DebugVisualizer.DebuggerSide.vsix'
    artifact: 'DebugVisualizer'
    publishLocation: 'pipeline'
    
- task: PublishPipelineArtifact@1
  displayName: Publish version file to pipeline
  inputs:
    targetPath: 'MarkMpn.Sql4Cds.SSMS\sql4cds-version.txt'
    artifact: 'SSMSVersion'
    publishLocation: 'pipeline'

- script: |
    call npm ci --ignore-scripts
    if errorlevel 1 exit /b %errorlevel%
    call npm --no-git-tag-version --allow-same-version version $(GitVersion.SemVer)
    if errorlevel 1 exit /b %errorlevel%
    call npm run package
  displayName: Build VS Code extension
  workingDirectory: '$(Build.SourcesDirectory)\VSCodeExtension'

- task: PublishPipelineArtifact@1
  displayName: Publish VS Code Extension installer to pipeline
  inputs:
    targetPath: 'VSCodeExtension\sql4cds.vsix'
    artifact: 'VSCodeInstaller'
    publishLocation: 'pipeline'

- task: PowerShell@2
  displayName: Stamp PPTB client and worker release versions
  inputs:
    targetType: inline
    pwsh: true
    workingDirectory: '$(Build.SourcesDirectory)\MarkMpn.Sql4Cds.PPTB'
    script: |
      npm ci --ignore-scripts
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      npm --no-git-tag-version --allow-same-version version $(GitVersion.SemVer)
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $config = Get-Content pptb.config.json -Raw | ConvertFrom-Json
      $config.workers.sql4cds.packageVersion = '$(GitVersion.NuGetVersion)'
      $config | ConvertTo-Json -Depth 10 | Set-Content pptb.config.json

- task: DotNetCoreCLI@2
  displayName: Package PPTB language server worker
  inputs:
    command: custom
    custom: pack
    arguments: 'MarkMpn.Sql4Cds.LanguageServer/MarkMpn.Sql4Cds.LanguageServer.csproj --configuration Release --no-restore -p:Version=$(GitVersion.NuGetVersion) --output $(Build.ArtifactStagingDirectory)/PPTB/worker'

- script: |
    call npm run build
    if errorlevel 1 exit /b %errorlevel%
    call npm run finalize-package
    if errorlevel 1 exit /b %errorlevel%
    call npm pack --pack-destination "$(Build.ArtifactStagingDirectory)\PPTB"
  displayName: Build and package PPTB client
  workingDirectory: '$(Build.SourcesDirectory)\MarkMpn.Sql4Cds.PPTB'

- task: PublishPipelineArtifact@1
  displayName: Publish PPTB client and worker packages to pipeline
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/PPTB'
    artifact: 'PPTBPackages'
    publishLocation: 'pipeline'

- task: GitTag@5
  displayName: Label Source
  condition: and(succeeded(), eq(variables.isMain, 'true'))
  inputs:
    workingdir: '$(Build.SourcesDirectory)'
    tag: 'v$(GitVersion.NuGetVersion)'
  env:
    SYSTEM_ACCESSTOKEN: '$(System.AccessToken)'