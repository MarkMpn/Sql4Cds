<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SQL 4 CDS</title>
    </head>
    <body>
        <div id="app">
            <div class="toolbar" role="toolbar">
                <button id="btn-new" title="New query (Ctrl+Alt+N)"><span class="icon">＋</span> New Query</button>
                <button id="btn-run" class="primary" title="Run the selected text, or the whole query if nothing is selected (F5 / Ctrl+E)" disabled><span class="icon">▶</span> Run</button>
                <button id="btn-cancel" title="Cancel the running query" disabled><span class="icon">■</span> Cancel</button>
                <span class="toolbar-separator"></span>
                <label for="connection-select">Connection</label>
                <select id="connection-select" disabled></select>
                <span class="toolbar-spacer"></span>
                <button id="btn-settings" title="Settings"><span class="icon">⚙</span> Settings</button>
            </div>
            <div class="tool-content">
                <button id="explorer-tab" class="explorer-tab" aria-label="Show Object Explorer" aria-controls="object-explorer" aria-expanded="false" hidden>Object Explorer</button>
                <aside id="object-explorer" class="object-explorer" aria-label="Object Explorer">
                    <div class="explorer-heading">
                        <strong>Object Explorer</strong>
                        <button id="explorer-pin" class="explorer-pin" title="Unpin Object Explorer" aria-label="Unpin Object Explorer" aria-pressed="true">
                            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 2h6M6 2v5l-2 3h8l-2-3V2M8 10v5" /></svg>
                        </button>
                    </div>
                    <div id="explorer-tree" class="explorer-tree"></div>
                </aside>
                <div id="explorer-splitter" class="explorer-splitter" role="separator" aria-label="Resize Object Explorer" aria-orientation="vertical"></div>
                <div class="query-area">
                    <div id="tab-strip" class="tab-strip" role="tablist"></div>
                    <div id="workspace" class="workspace">
                        <div id="editor" class="editor"></div>
                        <div id="splitter" class="splitter" role="separator" aria-orientation="horizontal"></div>
                        <div id="results-host" class="results-host"></div>
                    </div>
                </div>
            </div>
            <div class="status-bar">
                <span id="status-message" role="status">
                    <span id="status-icon" aria-hidden="true"></span>
                    <span id="status-text">Loading…</span>
                </span>
                <span id="status-progress" class="status-progress"></span>
                <span id="status-server">
                    <span id="status-lock" aria-hidden="true"></span>
                    <span id="status-domain"></span>
                </span>
                <span id="status-user"></span>
                <span id="status-database"></span>
                <span id="status-elapsed" title="Elapsed query time">00:00:00</span>
                <span id="status-rows" title="Total rows across all result sets">0 rows</span>
            </div>
        </div>
        <script type="module" src="./app.ts"></script>
    </body>
</html>
